site_name: Modern Marvels Archive
site_description: Canonical Episode Cross-Reference and Historical Evidence Archive
site_url: https://shanto.github.io/Modern-Marvels-Public/
repo_url: https://github.com/shanto/Modern-Marvels-Public
repo_name: shanto/Modern-Marvels-Public
theme:
  name: material
  palette:
  - scheme: default
    primary: indigo
    accent: deep orange
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - scheme: slate
    primary: indigo
    accent: deep orange
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
  features:
  - navigation.top
  - navigation.sections
  - search.suggest
  - search.highlight
  - content.code.copy
plugins:
- search
markdown_extensions:
- admonition
- pymdownx.details
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
- tables
- attr_list
